<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Library</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>My Collection</h1>
            <button id="add-btn" class="primary-btn">+ Add Item</button>
        </header>

        <main>
            <div id="library-grid" class="library-grid">
                <!-- Items will be injected here by JS -->
            </div>
        </main>
    </div>

    <!-- Add Item Modal -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h2>Add New Item</h2>
                <button id="close-modal" class="close-btn">&times;</button>
            </div>
            <form id="add-form">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" required placeholder="e.g. The Matrix">
                </div>
                <div class="form-group">
                    <label for="creator">Creator / Author</label>
                    <input type="text" id="creator" required placeholder="e.g. Wachowskis">
                </div>
                <div class="form-row">
                    <div class="form-group half">
                        <label for="type">Type</label>
                        <select id="type" required>
                            <option value="Book">Book</option>
                            <option value="Movie">Movie</option>
                            <option value="Game">Game</option>
                            <option value="Music">Music</option>
                        </select>
                    </div>
                    <div class="form-group half">
                        <label for="year">Release Year</label>
                        <input type="number" id="year" placeholder="1999">
                    </div>
                </div>
                <div class="form-group">
                    <label for="rating">Rating (1-5)</label>
                    <div class="rating-stars">
                        <!-- Simple number input for now, could be styled as stars -->
                        <input type="number" id="rating" min="1" max="5" value="5" required>
                    </div>
                </div>
                <button type="submit" class="primary-btn full-width">Save to Library</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
